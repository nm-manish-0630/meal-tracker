name: CI

on:
  push:
  pull_request:

# Placeholders: prisma generate only reads the schema file, never connects.
env:
  DATABASE_URL: postgresql://user:pass@localhost:5432/db
  DIRECT_URL: postgresql://user:pass@localhost:5432/db

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.1

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - run: pnpm install --frozen-lockfile

      # apps/api check-types and test need the generated client, but neither
      # depends on api's own build (which also runs prisma migrate deploy
      # against a real DB), so generate it explicitly here instead.
      - run: pnpm --filter api run db:generate

      - run: pnpm lint
      - run: pnpm check-types
      - run: pnpm test
