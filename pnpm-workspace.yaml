packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  "@parcel/watcher": true
  '@prisma/engines': true
  "@swc/core": true
  pnpm: true
  prisma: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - jsdom@30.1.1
  - unplugin-swc@2.0.0
  - '@aws-sdk/client-s3@3.1143.0'
  - '@aws-sdk/s3-request-presigner@3.1143.0'
